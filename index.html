<!DOCTYPE html>
<!-- Piattaforma Orus - Index.html v2.23 (Home ad anteprime, 16/11/2026) + v2.22 (memoria dell'app Android, 16/11/2026) + v2.21 (versione telefono / app, 16/11/2026) + v2.20 (livello selezioni + nuovi festival: forse e note + proposta festival + filtri avanzati festival + edizioni precedenti + notifiche + senza da decidere + codice no + iscrizioni dalle mail + progetti a tendina + grafica Orus + accesso + calendario con partecipanti + ricerca festival + nuovo festival dal link + report + nuovi festival, 10/11/2026). -->
<html lang="it">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== GRAFICA ORUS - inizio (v2.5, 07/11/2026) =====
     Per cambiare un colore o un font si modifica solo il blocco :root qui sotto. */
  :root {
    /* Marchio (dal logo) */
    --orus-rosso: #C0262C; --orus-rosso-scuro: #830B0B; --orus-nero: #0E0E0E;
    /* Superfici e testo */
    --sfondo: #F5F3F0; --carta: #FFFFFF; --carta-2: #FAF8F5; --bordo: #E4DFD8; --bordo-forte: #CFC8BE;
    --testo: #1A1A1A; --grigio: #6B6660; --grigio-chiaro: #A39D95; --tenue: #EFEBE5;
    /* Azioni (nere, non rosse: il rosso resta per marchio e urgenze) */
    --azione: #1A1A1A; --azione-hover: #3A3632;
    /* Stati (stesso significato di prima) */
    --verde: #2E6B3A; --verde-chiaro: #E6F0E4; --giallo: #7A5208; --giallo-chiaro: #FBF0D8;
    --rosso: #A11D23; --rosso-chiaro: #F8E4E3; --blu: #2F4A6B; --blu-chiaro: #E6EBF2;
    --oro: #E9C25A; --oro-testo: #3F2E00;
    /* Caratteri */
    --font-titoli: "Crimson Pro", Georgia, "Times New Roman", serif;
    --font-testo: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-testo); color: var(--testo); background: var(--sfondo); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--orus-rosso); outline-offset: 2px; }

  /* Testata */
  header { background: var(--orus-nero); color: #fff; padding: 0 24px; display: flex; align-items: center; gap: 30px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; padding: 12px 0; display: flex; align-items: center; gap: 12px; white-space: nowrap; font-size: 0; }
  header h1 .logo-orus { height: 30px; width: auto; display: block; }
  header h1 .sottotitolo { font-family: var(--font-testo); font-size: 10px; letter-spacing: 3.5px; text-transform: uppercase; color: #8F8A83; padding-top: 4px; }
  nav { display: flex; gap: 2px; flex-wrap: wrap; }
  nav button { background: none; border: 0; color: #A8A39C; font: inherit; font-size: 13.5px; padding: 19px 13px 16px; cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s; }
  nav button:hover { color: #fff; }
  nav button.attivo { color: #fff; border-bottom-color: var(--orus-rosso); }
  .info-utente { margin-left: auto; font-size: 12px; color: #8F8A83; display: flex; gap: 12px; align-items: center; }
  .info-utente button { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; padding: 6px 11px; font: inherit; cursor: pointer; }
  .info-utente button:hover { background: rgba(255,255,255,.16); }

  /* Impaginazione e titoli */
  main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 40px; }
  h2 { font-family: var(--font-titoli); font-size: 28px; font-weight: 500; margin: 0; letter-spacing: .2px; line-height: 1.15; }
  h3 { font-size: 11px; font-weight: 600; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--grigio); }
  .titolo-sezione { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .titolo-sezione .azioni { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .titolo-sezione h2 .conteggio { font-family: var(--font-testo); font-size: 13px; }
  .griglia-schede { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
  .scheda { background: var(--carta); border: 1px solid var(--bordo); border-radius: 10px; padding: 18px 20px; }

  /* Numeri della Panoramica e del profilo */
  .numeri { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .numero { background: var(--carta); border: 1px solid var(--bordo); border-radius: 10px; padding: 14px 16px; transition: border-color .15s; }
  .numero[data-vai] { cursor: pointer; }
  .numero[data-vai]:hover { border-color: var(--bordo-forte); }
  .numero b { display: block; font-size: 28px; font-weight: 500; color: var(--testo); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .numero span { color: var(--grigio); font-size: 12.5px; }
  .numero[data-vai="festival"] { border-left: 3px solid var(--orus-rosso); border-radius: 0 10px 10px 0; }
  .numero[data-vai="festival"] b { color: var(--rosso); }

  /* Elenchi, etichette */
  .riga-lista { padding: 10px 0; border-top: 1px solid var(--tenue); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .riga-lista:first-of-type { border-top: 0; }
  .sub { color: var(--grigio); font-size: 12px; margin-top: 2px; }
  .vuoto { color: var(--grigio); font-style: italic; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11.5px; white-space: nowrap; background: var(--tenue); color: #4A453F; margin: 1px 2px 1px 0; }
  .b-verde { background: var(--verde-chiaro); color: var(--verde); }
  .b-giallo { background: var(--giallo-chiaro); color: var(--giallo); }
  .b-rosso { background: var(--rosso-chiaro); color: var(--rosso); }
  .b-grigio { background: var(--tenue); color: var(--grigio); }

  /* Filtri e campi */
  .filtri { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  input[type=search], input[type=text], input[type=date], input[type=email], textarea, select {
    font: inherit; padding: 7px 10px; border: 1px solid var(--bordo); border-radius: 6px; background: var(--carta); color: var(--testo); }
  input:focus, textarea:focus, select:focus { border-color: var(--testo); outline: none; box-shadow: 0 0 0 3px rgba(26,26,26,.08); }
  input[type=search] { min-width: 240px; }
  .ricerca-festival { position: relative; display: inline-flex; align-items: center; }
  .ricerca-festival input { min-width: 320px; padding-right: 30px; }
  .svuota-ricerca { position: absolute; right: 6px; border: 0; background: none; font-size: 18px; line-height: 1; color: var(--grigio); cursor: pointer; padding: 2px 4px; }
  input[type=search]::-webkit-search-cancel-button { display: none; }
  textarea { width: 100%; min-height: 64px; resize: vertical; }
  input[type=checkbox] { accent-color: var(--azione); }
  .chip { border: 1px solid var(--bordo); background: var(--carta); border-radius: 16px; padding: 6px 13px; font: inherit; font-size: 13px; cursor: pointer; color: var(--testo); }
  .chip:hover { border-color: var(--bordo-forte); }
  .chip.attivo { background: var(--azione); color: #fff; border-color: var(--azione); }

  /* Pulsanti */
  .pulsante { border: 1px solid var(--azione); background: var(--azione); color: #fff; border-radius: 6px; padding: 8px 15px; font: inherit; font-weight: 500; cursor: pointer; transition: background .15s; }
  .pulsante:hover { background: var(--azione-hover); border-color: var(--azione-hover); }
  .pulsante.secondario { background: var(--carta); color: var(--testo); border-color: var(--bordo-forte); }
  .pulsante.secondario:hover { background: var(--carta-2); border-color: var(--testo); }
  .pulsante:disabled { opacity: .5; cursor: default; }
  .segmenti { display: inline-flex; border: 1px solid var(--bordo); border-radius: 6px; overflow: hidden; background: var(--carta); }
  .segmenti button { border: 0; background: var(--carta); padding: 7px 13px; font: inherit; font-size: 13px; cursor: pointer; color: var(--grigio); }
  .segmenti button + button { border-left: 1px solid var(--bordo); }
  .segmenti button.attivo { background: var(--testo); color: #fff; font-weight: 500; }
  label.check { display: flex; gap: 6px; align-items: center; color: var(--grigio); cursor: pointer; }

  /* Tabelle */
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--carta); border: 1px solid var(--bordo); border-radius: 10px; overflow: hidden; }
  th { text-align: left; font-size: 10.5px; color: var(--grigio); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 10px 12px; background: var(--carta-2); border-bottom: 1px solid var(--bordo); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--tenue); vertical-align: top; }
  tbody tr:last-child > td { border-bottom: 0; }
  tr.cliccabile { cursor: pointer; }
  tr.cliccabile:hover td { background: var(--carta-2); }
  tr.dettaglio > td { background: var(--carta-2); padding: 20px; border-bottom: 1px solid var(--bordo); }
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .conteggio { color: var(--grigio); font-size: 13px; }
  dl { display: grid; grid-template-columns: 160px 1fr; gap: 7px 14px; margin: 0; }
  dt { color: var(--grigio); }
  dd { margin: 0; word-break: break-word; }
  a { color: var(--testo); text-decoration-color: var(--bordo-forte); text-underline-offset: 2px; }
  a:hover { color: var(--orus-rosso); text-decoration-color: var(--orus-rosso); }

  /* Schede dei film */
  .carte { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .carta { background: var(--carta); border: 1px solid var(--bordo); border-radius: 10px; padding: 16px 18px; cursor: pointer; transition: border-color .15s, transform .15s; }
  .carta:hover { border-color: var(--testo); transform: translateY(-1px); }
  .carta h4 { margin: 0 0 4px; font-family: var(--font-titoli); font-size: 21px; font-weight: 500; line-height: 1.2; }
  .carta .sub { margin-bottom: 10px; }
  .mini { display: flex; gap: 14px; margin-top: 10px; font-size: 12.5px; color: var(--grigio); }
  .mini b { color: var(--testo); font-weight: 600; }
  .indietro { background: none; border: 0; color: var(--grigio); font: inherit; font-size: 13px; cursor: pointer; padding: 0; margin-bottom: 14px; }
  .indietro:hover { color: var(--testo); }
  .profilo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .profilo .largo { grid-column: 1 / -1; }
  .pulsanti-link { display: flex; gap: 8px; flex-wrap: wrap; }
  .pulsanti-link a { display: inline-block; padding: 7px 12px; border: 1px solid var(--bordo); border-radius: 6px; text-decoration: none; background: var(--carta); font-size: 13px; }
  .pulsanti-link a:hover { border-color: var(--testo); color: var(--testo); }
  .giorno { font-family: var(--font-titoli); font-size: 18px; font-weight: 500; margin: 18px 0 6px; }

  /* Caricamento con l'occhio Orus */
  .caricamento { text-align: center; padding: 90px 20px; color: var(--grigio); font-size: 13px; letter-spacing: .3px; }
  .caricamento::before { content: ""; display: block; width: 64px; height: 41px; margin: 0 auto 16px; background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1197 768%22%3E%3Cpath fill=%22%23C0262C%22 fill-rule=%22evenodd%22 d=%22M964,260 946,264 927,272 907,286 893,301 884,315 875,337 871,360 872,383 879,408 888,425 898,438 916,454 935,465 953,471 972,474 994,473 1017,467 1035,458 1051,446 1063,433 1075,414 1083,392 1086,371 1085,352 1080,331 1070,310 1057,293 1045,282 1024,269 1004,262 993,260ZM950,151 913,158 885,168 863,179 831,201 809,222 798,235 782,258 770,281 757,318 753,338 751,358 752,401 755,419 763,447 772,469 780,484 791,501 805,519 827,541 838,550 864,567 884,577 912,587 946,594 958,594 959,595 1001,594 1023,590 1053,581 1086,565 1103,554 1125,536 1152,506 1167,483 1179,459 1188,433 1195,397 1195,385 1196,384 1195,349 1192,329 1186,306 1180,289 1169,266 1158,248 1142,227 1113,199 1080,177 1059,167 1040,160 1017,154 997,151ZM960,174 986,174 1010,177 1045,187 1077,203 1103,222 1124,243 1132,253 1152,285 1165,319 1169,336 1172,360 1171,396 1163,433 1149,466 1136,487 1126,500 1101,525 1071,546 1038,561 1012,568 992,571 955,571 934,568 915,563 898,557 881,549 864,539 849,528 824,504 809,485 798,467 789,448 782,428 775,392 775,353 778,333 783,314 795,284 806,265 820,246 847,219 880,197 897,189 920,181 937,177ZM1093,93 1067,77 1033,59 992,41 953,27 921,18 885,10 845,4 834,4 810,1 756,0 696,6 645,17 595,34 496,76 421,112 345,153 261,203 190,249 177,256 172,261 141,281 74,328 1,382 0,384 62,431 146,490 225,542 308,593 378,633 454,672 515,700 581,728 584,728 615,741 658,754 692,761 748,767 807,767 829,764 841,764 857,761 865,761 916,751 975,733 1015,717 1068,690 1091,676 1093,673 1048,682 997,687 934,687 883,682 829,672 787,660 740,641 699,619 669,599 629,566 610,547 596,527 575,503 565,487 559,475 558,469 553,461 547,443 540,409 538,377 541,351 545,332 557,297 568,275 589,244 611,219 642,190 671,167 712,141 748,123 786,1   @keyframes orus-respiro { 0%, 100% { opacity: .35; transform: scale(.94); } 50% { opacity: 1; transform: scale(1); } }

  .avviso { background: var(--giallo-chiaro); color: var(--giallo); padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
  .commento { white-space: pre-wrap; color: var(--grigio); font-size: 13px; max-width: 420px; margin-top: 4px; }

  /* Selettori dello stato di un film */
  select.cod { padding: 4px 6px; font-size: 13px; border-radius: 6px; min-width: 130px; }
  select.cod.compatto { min-width: 0; width: 100%; font-size: 12px; padding: 3px 4px; }
  select.cod.c-forse { background: var(--giallo-chiaro); color: var(--giallo); border-color: #EBD7A8; }
  select.cod.c-no { background: #e9e7e3; color: #7a756e; text-decoration: line-through; }
  select.cod.c-iscritto { background: var(--blu-chiaro); color: var(--blu); border-color: #C9D3E0; }
  select.cod.c-selezionato { background: var(--verde-chiaro); color: var(--verde); border-color: #BFD6BA; font-weight: 600; }
  select.cod.c-vincitore { background: var(--oro); color: var(--oro-testo); border-color: #D4A93A; font-weight: 700; }
  select.cod.c-nonsel { background: var(--tenue); color: var(--grigio); }
  select.cod.c-vuoto { color: var(--grigio-chiaro); }
  select:disabled { opacity: .5; }

  /* Griglia festival x film */
  .scorri { overflow-x: auto; border: 1px solid var(--bordo); border-radius: 10px; background: var(--carta); }
  table.griglia { border: 0; border-radius: 0; min-width: 1100px; overflow: visible; }
  table.griglia th, table.griglia td { padding: 6px 6px; }
  table.griglia th.film { white-space: normal; font-size: 10.5px; width: 108px; line-height: 1.25; }
  table.griglia td.nome { position: sticky; left: 0; background: var(--carta); min-width: 230px; max-width: 260px; z-index: 1; box-shadow: 1px 0 0 var(--bordo); }
  table.griglia th.nome { position: sticky; left: 0; z-index: 2; }

  /* Finestra di modifica */
  #modale { position: fixed; inset: 0; background: rgba(14,14,14,.55); display: none; align-items: flex-start; justify-content: center; z-index: 20; overflow-y: auto; padding: 40px 16px; }
  #modale.aperto { display: flex; }
  .finestra { background: var(--carta); border-radius: 12px; width: 100%; max-width: 860px; padding: 24px 26px; box-shadow: 0 18px 50px rgba(0,0,0,.28); border-top: 3px solid var(--orus-rosso); }
  .finestra h2 { margin-bottom: 18px; }
  .campi { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .campi .campo { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--grigio); }
  .campi .campo.largo { grid-column: 1 / -1; }
  .campi input, .campi select, .campi textarea { width: 100%; color: var(--testo); font-size: 14px; }
  .piede { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--tenue); }
  .aggiungi { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .aggiungi input { flex: 1; min-width: 220px; }
  .input-riga { width: 100%; padding: 4px 8px; font-size: 13px; }
  table.scad { margin-top: 4px; font-size: 13px; }
  table.scad th, table.scad td { padding: 6px 8px; }
  table.scad tr.evid td { background: #F3EDE3; }

  /* Profilo film: gruppi e scelte */
  .testa-scheda { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .testa-scheda h3 { margin: 0; }
  .completezza { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--grigio); }
  .completezza .barra { width: 90px; height: 5px; background: var(--tenue); border-radius: 3px; overflow: hidden; display: inline-block; }
  .completezza .barra span { display: block; height: 100%; background: var(--verde); }
  .scelta, .premiere { display: flex; gap: 6px; flex-wrap: wrap; }
  .scelta select, .premiere select { flex: 0 0 auto; width: auto; min-width: 160px; }
  .scelta input, .premiere input { flex: 1; min-width: 180px; }
  .multi { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px solid var(--bordo); border-radius: 8px; background: var(--carta-2); }
  .multi label.opz { display: inline-flex; flex-direction: row; align-items: center; gap: 5px; padding: 4px 10px; border: 1px solid var(--bordo); border-radius: 14px; background: var(--carta); font-size: 13px; color: var(--testo); cursor: pointer; }
  .multi label.opz input { width: auto; margin: 0; }
  .multi label.opz:has(input:checked) { background: var(--testo); border-color: var(--testo); color: #fff; }
  .multi label.opz.nuova { border-style: dashed; }
  .aggiungi-altro { display: inline-flex; gap: 4px; align-items: center; }
  .aggiungi-altro input { width: 140px !important; padding: 4px 8px; font-size: 13px; }

  /* Festival compatibili */
  .rosso { color: var(--rosso); font-weight: 600; }
  .testo-avviso { color: #A0560A; font-size: 12px; }
  .pulsante.piccolo { padding: 4px 10px; font-size: 12px; white-space: nowrap; }
  .dv { display: inline-block; background: var(--tenue); color: var(--grigio); border-radius: 10px; padding: 1px 7px; font-size: 11px; cursor: help; border-bottom: 1px dotted var(--grigio); }
  table.compat td { vertical-align: middle; }
  .tag { display: inline-flex; align-items: center; gap: 4px; border: 1px solid; border-radius: 12px; padding: 3px 9px; margin: 2px 3px 2px 0; font: inherit; font-size: 12px; background: var(--carta); }
  button.tag { cursor: pointer; }
  .tag.t-ok { background: var(--verde-chiaro); color: var(--verde); border-color: #BFD6BA; }
  .tag.t-ok:hover { background: #D5E6D1; }
  .tag.t-avviso { background: #FBE8D2; color: #8E4A06; border-color: #F0C896; }
  .tag.t-avviso:hover { background: #F8DBBA; }
  .tag.t-grigio { background: var(--tenue); color: var(--grigio); border-color: var(--bordo); }
  .tag.t-escluso { color: var(--grigio-chiaro); border-color: var(--bordo); text-decoration: line-through; cursor: help; }
  .tag .q { font-weight: 700; border-radius: 8px; background: rgba(0,0,0,.08); padding: 0 5px; }
  .legenda { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--grigio); margin-bottom: 12px; }
  details.esclusi summary { cursor: pointer; color: var(--grigio); font-size: 13px; margin-top: 4px; }

  /* Messaggi */
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--orus-nero); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; border-left: 3px solid var(--verde-chiaro); }
  #toast.visibile { opacity: 1; }
  #toast.errore { background: var(--rosso); border-left-color: #fff; }

  /* Telefono */
  @media (max-width: 760px) {
    main { padding: 16px 14px 30px; }
    h2 { font-size: 24px; }
    .profilo, .campi { grid-template-columns: 1fr; }
    dl { grid-template-columns: 1fr; }
    dt { margin-top: 6px; }
    .info-utente { display: none; }
    .nascondi-mobile { display: none; }
    header { position: static; padding: 0 12px; gap: 0; }
    header h1 { padding: 12px 0 4px; }

  .numeri-home { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .anteprime { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; align-items: start; }
  .anteprima { background: var(--carta); border: 1px solid var(--bordo); border-radius: 10px; overflow: hidden; }
  .anteprima.urgente { border-left: 3px solid var(--orus-rosso); }
  .testa-anteprima { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; font: inherit; font-weight: 600; font-size: 14.5px; color: var(--testo); padding: 13px 16px; cursor: pointer; text-align: left; }
  .testa-anteprima:disabled { cursor: default; }
  .icona-home { width: 20px; height: 20px; flex: none; color: var(--grigio); }
  .anteprima.urgente .icona-home { color: var(--orus-rosso); }
  .titolo-anteprima { flex: 1; min-width: 0; }
  .conta-anteprima { min-width: 24px; padding: 1px 8px; border-radius: 12px; background: var(--tenue); color: var(--grigio); font-size: 12px; font-weight: 600; text-align: center; }
  .anteprima.urgente .conta-anteprima { background: var(--rosso-chiaro); color: var(--rosso); }
  .freccia-anteprima { color: var(--grigio); font-size: 12px; width: 10px; }
  .anteprima.vuota .testa-anteprima { padding-bottom: 4px; }
  .anteprima.vuota .titolo-anteprima { color: var(--grigio); font-weight: 500; }
  .vuoto-anteprima { padding: 0 16px 12px 46px; font-size: 12.5px; color: var(--grigio); }
  .corpo-anteprima { padding: 0 16px 10px; }
  .voce-anteprima { padding: 8px 0; border-top: 1px solid var(--tenue); }
  .riga-anteprima { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .riga-anteprima > :first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .riga-anteprima a { font-weight: 500; text-decoration: none; }
  .riga-anteprima .badge, .riga-anteprima .sub { flex: none; }
  .dett-anteprima { display: none; font-size: 12.5px; color: var(--grigio); margin-top: 3px; }
  .anteprima.aperta .dett-anteprima { display: block; }
  .anteprima.aperta .riga-anteprima > :first-child { white-space: normal; }
  .voce-anteprima.extra { display: none; }
  .anteprima.aperta .voce-anteprima.extra { display: block; }
  .altri-anteprima, .vai-anteprima { display: block; width: 100%; background: none; border: 0; border-top: 1px solid var(--tenue); font: inherit; font-size: 13px; color: var(--grigio); padding: 9px 0 3px; text-align: left; cursor: pointer; }
  .vai-anteprima { color: var(--testo); font-weight: 500; }

  .corpo-anteprima > .scheda > h3 { display: none; }

    .testa-anteprima { padding: 14px 14px; }
    .corpo-anteprima { padding: 0 14px 10px; }

<style>
  /* Sul computer: icone e nomi brevi del menu nascosti */
  .icona-nav, .nome-breve, .icona-ricarica, #chiudi-modale { display: none; }

  @media (max-width: 760px) {
    :root { --altezza-nav: 60px; }
    body { -webkit-tap-highlight-color: rgba(192,38,44,.12); }

    /* Testata sottile in alto, sempre visibile */
    header { position: sticky; top: 0; z-index: 15; flex-wrap: nowrap; gap: 8px; padding: env(safe-area-inset-top) 12px 0; min-height: 50px; }
    header h1 { padding: 10px 0; }
    header h1 .logo-orus { height: 22px; }
    header h1 .sottotitolo { font-size: 8.5px; letter-spacing: 2.5px; }
    header .info-utente { position: static !important; margin-left: auto; gap: 8px; }
    header .info-utente #nome-utente { display: none; }
    header .info-utente button { padding: 7px 10px; }
    header .info-utente button#ricarica { display: inline-flex !important; align-items: center; padding: 6px 8px; }
    #ricarica .testo-ricarica { display: none; }
    #ricarica .icona-ricarica { display: block; }
    #pannello-notifiche { position: absolute; top: 100%; left: 8px; right: 8px; width: auto; max-height: calc(100vh - 140px); }

    /* Menu in basso, come in un'app */
    nav#menu { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; width: auto; overflow: visible;
      background: var(--orus-nero); border-top: 1px solid rgba(255,255,255,.08); padding-bottom: env(safe-area-inset-bottom); }
    nav#menu button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: var(--altezza-nav);
      padding: 6px 2px 5px; border-bottom: 0; border-top: 2px solid transparent; font-size: 10px; line-height: 1.1; white-space: nowrap; min-width: 0; }
    nav#menu button.attivo { border-top-color: var(--orus-rosso); color: #fff; }
    nav#menu .icona-nav { display: block; width: 22px; height: 22px; }
    nav#menu .nome-nav { display: none; }
    nav#menu .nome-breve { display: block; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    nav#menu .badge-nav { position: absolute; top: 5px; left: 50%; margin-left: 5px; min-width: 16px; line-height: 16px; font-size: 10px; padding: 0 4px; }

    /* Spazio per il menu in basso */
    main { padding: 14px 12px calc(var(--altezza-nav) + env(safe-area-inset-bottom) + 24px); }
    #toast { bottom: calc(var(--altezza-nav) + env(safe-area-inset-bottom) + 12px); max-width: calc(100vw - 24px); }

    /* Titoli, schede e numeri */
    h2 { font-size: 23px; }
    .titolo-sezione { gap: 10px; margin-bottom: 14px; }
    .titolo-sezione .azioni { margin-left: 0; width: 100%; }
    .titolo-sezione .azioni .pulsante { flex: 1; }
    .griglia-schede { grid-template-columns: 1fr; gap: 12px; }
    .scheda { padding: 14px 15px; }
    .numeri { grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .numero { padding: 11px 12px; }
    .numero b { font-size: 24px; }
    .numero span { font-size: 12px; }
    .carte { grid-template-columns: 1fr; gap: 10px; }
    .carta:hover { transform: none; }
    .riga-lista { gap: 10px; }
    .riga-lista > span:first-child { min-width: 0; }

    /* Campi e pulsanti più comodi da toccare (16 px evita lo zoom automatico sui telefoni) */
    input[type=search], input[type=text], input[type=date], input[type=email], input[type=time], input[type=number], textarea, select { font-size: 16px; padding: 9px 10px; }
    select.cod { font-size: 15px; padding: 7px 8px; min-width: 140px; }
    select.cod.compatto { font-size: 12px; padding: 4px 3px; }
    .pulsante { padding: 10px 15px; }
    .pulsante.piccolo { padding: 7px 11px; font-size: 13px; }
    .chip { padding: 8px 13px; }
    .segmenti button { padding: 9px 12px; }
    .filtri { gap: 8px; }
    .filtri .check { padding: 4px 0; }
    .aggiungi input { min-width: 0; flex-basis: 100%; }
    .aggiungi select { flex: 1; }
    .filtri-av-corpo { grid-template-columns: 1fr; padding: 4px 14px 14px; }
    details.tendina > summary { padding: 14px 14px; }
    .corpo-tendina { padding: 0 12px 14px; }
    .dettaglio-qui { padding: 10px 12px; }

    /* Elenco festival e proposte: ogni riga diventa una scheda */
    table.lista-mobile, table.lista-mobile tbody { display: block; }
    table.lista-mobile thead { display: none; }
    table.lista-mobile tbody tr { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; padding: 12px 14px; border-bottom: 1px solid var(--tenue); }
    table.lista-mobile tbody tr:last-child { border-bottom: 0; }
    table.lista-mobile tbody td { display: block; padding: 0; border: 0; background: none !important; min-width: 0; }
    table.lista-mobile td.nascondi-mobile { display: block; }
    table.lista-mobile tbody td:empty { display: none; }
    table.lista-mobile tbody td[data-etichetta]::before { content: attr(data-etichetta); display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--grigio); margin-bottom: 2px; }
    table.lista-mobile tbody td:only-child { grid-column: 1 / -1; }
    table.lista-mobile tbody tr.dettaglio { display: block; padding: 0; background: var(--carta-2); }
    table.lista-mobile tbody tr.dettaglio > td { padding: 14px 12px; border-bottom: 1px solid var(--bordo); }
    /* Festival: nome a sinistra, ID a destra, poi stato, scadenza, fee, film */
    table.festival-mobile tbody tr:not(.dettaglio) > td:nth-child(1) { grid-column: 2; grid-row: 1; color: var(--grigio); font-size: 12px; text-align: right; }
    table.festival-mobile tbody tr:not(.dettaglio) > td:nth-child(2) { grid-column: 1; grid-row: 1; font-size: 15px; }
    table.festival-mobile tbody tr:not(.dettaglio) > td:nth-child(n+3) { grid-column: 1 / -1; }
    table.festival-mobile tbody tr.cliccabile:active { background: var(--carta-2); }
    /* Proposte: stato e chi valuta affiancati, il resto su tutta la larghezza */
    table.proposte-mobile tbody tr > td { grid-column: 1 / -1; }
    table.proposte-mobile tbody tr > td:nth-child(4) { grid-column: 1; }
    table.proposte-mobile tbody tr > td:nth-child(5) { grid-column: 2; }
    table.proposte-mobile select { width: 100%; }
    table.proposte-mobile tbody tr { grid-template-columns: 1fr 1fr; }

    /* Griglia film: colonne più strette, si scorre di lato */
    table.griglia { min-width: 0; }
    table.griglia th.film { width: 86px; min-width: 86px; font-size: 10px; }
    table.griglia td.nome { min-width: 150px; max-width: 170px; }

    /* Dettaglio festival e scadenze */
    tr.dettaglio > td { padding: 14px 12px; }
    table.scad { font-size: 12.5px; }
    table.scad th, table.scad td { padding: 6px 5px; }

    /* Finestre di modifica a tutto schermo, con i pulsanti sempre in fondo */
    #modale { padding: 0; align-items: stretch; }
    .finestra, .finestra.evento, .finestra.report { max-width: none; min-height: 100%; border-radius: 0; padding: 18px 14px 0; box-shadow: none; }
    .finestra > h2 { padding-right: 46px; margin-bottom: 14px; }
    .finestra .piede { position: sticky; bottom: 0; z-index: 2; background: var(--carta); margin: 18px -14px 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); flex-wrap: wrap; }
    .finestra .piede .pulsante { flex: 1; }
    .finestra .piede .spazio { display: none; }
    .finestra.report .report-corpo { padding-bottom: 24px; }
    .report-anteprima { padding: 6px; }
    #modale.aperto + #chiudi-modale { display: flex; align-items: center; justify-content: center; position: fixed; top: calc(env(safe-area-inset-top) + 12px); right: 10px; z-index: 22;
      width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--tenue); color: var(--testo); font-size: 24px; line-height: 1; cursor: pointer; }
    body:has(#modale.aperto) { overflow: hidden; }

    /* Calendario */
    .mese-nav { flex: 1; justify-content: space-between; }
    .griglia-mese .cella { min-height: 58px; }
  }
  @media (max-width: 370px) {
    nav#menu button { font-size: 9px; }
    .numeri { grid-template-columns: 1fr; }
  }
</style>
<!-- TELEFONO - fine -->
</head>

var CODICI = [  // [codice nel foglio, etichetta, categoria, etichetta breve per la griglia]

];
// Esiti che contano come selezione (il film è stato preso dal festival)
var POSITIVI = ['Selezionato', 'Fuori concorso', 'Quarti di finale', 'Semifinalista', 'Finalista', 'Nomination', 'Vincitore', "Menzione d'onore"];
var PREMI = ['Vincitore', "Menzione d'onore"];
function positivo(cat) { return POSITIVI.indexOf(cat) !== -1; }
var CODICI_LEGACY = ['f-', 'z']; // mostrati solo se già presenti

// ================= Utilità =================
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function linkSicuro(url, testo) {
  url = String(url || '').trim();
  if (!url) return '';
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(testo || url) + '</a>';
}
function num(s) { var n = parseInt(String(s).replace(/[^\d-]/g, ''), 10); return isNaN(n) ? null : n; }
function aIso(s) { var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(s || '')); return m ? m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2) : ''; }
var GIORNI = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
var MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
function giornoLeggibile(iso) { var p = iso.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return GIORNI[d.getDay()] + ' ' + d.getDate() + ' ' + MESI[d.getMonth()]; }
function fee(v, valuta) { v = String(v || '').trim(); return v ? v + ' ' + (valuta || '€') : ''; }
function feeCoppia(std, rid, valuta) {
  if (!std && !rid) return '';
  if (!rid || rid === std) return esc(fee(std, valuta));
  return esc(fee(std, valuta)) + ' <span class="sub">· ridotta ' + esc(fee(rid, valuta)) + '</span>';
}
function etichettaProssima(f) { return f.prossimaFinale ? 'Scadenza finale' : 'Prossima scadenza' + (f.tipoProssima ? ' · ' + f.tipoProssima : ''); }
function toast(testo, errore) {
  var t = document.getElementById('toast'); t.textContent = testo; t.className = 'visibile' + (errore ? ' errore' : '');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = ''; }, errore ? 5000 : 2200);
}
// Ogni chiamata al server porta con sé il token della sessione (primo argomento)
function chiama(funzione, args, ok, ko) {
  var runner = google.script.run.withSuccessHandler(ok).withFailureHandler(function (err) {
    var msg = err && err.message ? err.message : String(err);
    if (msg.indexOf('SESSIONE_SCADUTA') !== -1) {
      chiudiSessione();
      mostraAccesso('accesso', { errore: msg.replace(/^.*SESSIONE_SCADUTA:\s*/, '') });
    } else toast('Errore: ' + msg, true);
    if (ko) ko(err);
  });
  runner[funzione].apply(runner, [SESSIONE.token].concat(args || []));
}

function normCodice(c) { c = String(c || '').trim().toLowerCase(); return c.indexOf('non selez') === 0 ? 'non selez' : c; }
function infoCodice(c) { for (var i = 0; i < CODICI.length; i++) if (CODICI[i][0] === c) return CODICI[i]; return [c, c, 'Altro']; }
function categoria(c) { c = normCodice(c); return c ? infoCodice(c)[2] : null; }
function classeCodice(c) {
  var cat = categoria(c);
  if (!cat) return 'c-vuoto';
  if (cat.indexOf('Forse') === 0) return 'c-forse';
  if (cat === 'Non iscritto') return 'c-no';
  if (cat === 'Vincitore') return 'c-vincitore';
  if (positivo(cat)) return 'c-selezionato';
  if (cat === 'Non selezionato') return 'c-nonsel';
  return 'c-iscritto';
}
function classeStato(stato) {
  if (stato === 'Aperta') return 'b-verde';
  if (stato === 'Non ancora aperta') return 'b-giallo';
  if (stato === 'Da verificare') return 'b-rosso';
  return 'b-grigio';
}

// ================= Dati =================
function elabora(d) {
  var m = { film: [], festival: [], perId: {}, progetti: [], proposte: [] };
  var intest = d.iscrizioni[0] || [];
  var colNote = intest.indexOf('Note');
  var fine = colNote > 4 ? colNote : intest.length;
  for (var c = 4; c < fine; c++) if (intest[c]) m.film.push({ nome: intest[c], col: c });
  var iscr = {};
  d.iscrizioni.slice(1).forEach(function (r) {
    if (!r[0]) return;
    var codici = {};
    m.film.forEach(function (f) { var cod = normCodice(r[f.col]); if (cod) codici[f.nome] = cod; });
    iscr[r[0]] = { codici: codici, note: colNote >= 0 ? r[colNote] : '' };
  });
  // Festival: colonne lette per intestazione (aggiungere colonne al foglio non rompe nulla)
  var hf = d.festival[0] || [];
  var CF = { id: 'ID', nome: 'Festival', link: 'Link iscrizione', piattaforma: 'Piattaforma', ambito: 'Ambito', fascia: 'Fascia',
    durata: 'Durata max (min)', premi: 'Premi (€)', apertura: 'Apertura call', aperturaInd: 'Apertura (indicativa)',
    deadlineEarly: 'Deadline early', feeEarly: 'Fee early (€)', feeEarlyRid: 'Fee early ridotta (€)',
    deadline: 'Deadline finale', fee: 'Fee (€)', feeRid: 'Fee ridotta (€)', notifica: 'Notifica', stato: 'Stato call',
    prossima: 'Prossima deadline', feeProssima: 'Fee prossima deadline (€)', feeProssimaRid: 'Fee ridotta prossima deadline (€)',
    giorni: 'Giorni mancanti', riapertura: 'Riapertura stimata', note: 'Note', daVerificare: 'Da verificare',
    ultimoControllo: 'Ultimo controllo', fonte: 'Fonte controllo', info: 'Info edizione (auto)',
    premiereReq: 'Requisito premiere', tipoPremiere: 'Tipo premiere', completamentoMin: 'Completamento minimo', generiAmmessi: 'Generi ammessi',
    codiceSconto: 'Codice sconto', livelloSel: 'Livello selezioni', controlloSel: 'Controllo selezioni' };
  var idx = {}; Object.keys(CF).forEach(function (k) { idx[k] = hf.indexOf(CF[k]); });
  m.colonneMancanti = Object.keys(CF).filter(function (k) { return idx[k] === -1; }).map(function (k) { return CF[k]; });
  function val(r, k) { return idx[k] >= 0 ? (r[idx[k]] || '') : ''; }

  // Scadenze: una riga per scadenza (ID, Festival, Tipo, Data, Fee, Fee ridotta, Valuta)
  var hs = (d.scadenze && d.scadenze[0]) || [];
  var is = { id: hs.indexOf('ID festival'), tipo: hs.indexOf('Tipo scadenza'), data: hs.indexOf('Data'), fee: hs.indexOf('Fee'), rid: hs.indexOf('Fee ridotta'), valuta: hs.indexOf('Valuta') };
  var scad = {};
  (d.scadenze || []).slice(1).forEach(function (r) {
    var id = r[is.id]; if (!id || !r[is.data]) return;
    (scad[id] = scad[id] || []).push({ tipo: r[is.tipo] || '', data: r[is.data], iso: aIso(r[is.data]), fee: r[is.fee] || '', rid: r[is.rid] || '', valuta: r[is.valuta] || '' });
  });
  Object.keys(scad).forEach(function (id) { scad[id].sort(function (x, y) { return x.iso < y.iso ? -1 : x.iso > y.iso ? 1 : 0; }); });

  d.festival.slice(1).forEach(function (r) {
    var id = val(r, 'id'); if (!id) return;
    var f = {};
    Object.keys(CF).forEach(function (k) { f[k] = val(r, k); });
    f.stato = f.stato || 'Da verificare';
    f.giorni = num(f.giorni);
    f.scadenze = scad[id] || [];
    var vs = f.scadenze.filter(function (x) { return x.valuta; });

// Se i compatibili non sono pronti restituisce l'HTML da mostrare al loro posto

}
function filtriCompatHtml() {

function passaFiltriCompat(fe) {

  if (compatFiltri.ambito && fe.ambito !== compatFiltri.ambito) return false;

}
function compatFilm(titolo) { return (C.films || []).filter(function (x) { return x.titolo === titolo; })[0] || null; }
// Valutazione di un film per un festival, tenendo conto della griglia attuale nella pagina (anche dopo modifiche non ancora ricaricate)
function statoCompat(titolo, fe) {
  var f = M.perId[fe.id], codice = f ? f.codici[titolo] : '';

  if (precedenti(fe.id, titolo).length) return { esito: 'escluso', esclusioni: ['Già inviato a un\'edizione precedente (' + testoPrecedenti(fe.id, titolo) + ')'] }; // v2.16.1

  if (!v) return null;

function deadlineCompat(fe) {

function campoModulo(def, valore) {

function widgetScelta(nome, lista, valore) {

function widgetMulti(nome, lista, valore) {

// Valore di un campo del modulo, qualunque sia il suo tipo
function leggiCampo(form, def) {

    var sel = form.elements[nome];
    if (sel.value === '__altro') return form.querySelector('[data-altro-di="' + nome + '"]').value.trim().replace(/,/g, ' -');
    return sel.value;

function attivaWidget(radice) {

      if (sel.value === '__altro') inp.focus();

      if (esistente) esistente.checked = true;

        box.insertBefore(lab, box.querySelector('.aggiungi-altro'));

function apriModulo(titolo, campi, oggetto, alSalva, opz) {

  var mod = document.getElementById('modale'); mod.innerHTML = h; mod.classList.add('aperto');
  var form = document.getElementById('modulo');
  document.getElementById('annulla').onclick = chiudiModulo;
  mod.onclick = function (ev) { if (ev.target === mod) chiudiModulo(); };
  form.onsubmit = function (ev) {
    ev.preventDefault();
    var valori = {};
    campi.forEach(function (def) {
      var v = leggiCampo(form, def);
      var prima = oggetto ? (def[2] === 'date' ? aIso(oggetto[def[0]]) : (oggetto[def[0]] || '')) : '';

    });

    document.getElementById('salva').disabled = true;
    alSalva(valori, function () { document.getElementById('salva').disabled = false; });
  };
  attivaWidget(form);
  var primo = form.querySelector('input,select,textarea'); if (primo) primo.focus();
}

function numeroFee(v) { var n = parseFloat(String(v || '').replace(/[€\s]/g, '').replace(',', '.')); return isNaN(n) ? null : n; }
function euro(n) { return n.toFixed(2).replace('.', ',') + ' €'; }
function confermatoIscrivero(f, film) { return String(f.noteIscr || '').indexOf('✓ Iscriverò: ' + film + ' (') !== -1; }
function vociDaDecidere() {
  var out = [];
  M.festival.forEach(function (f) {
    if (f.stato !== 'Aperta' || f.giorni === null || f.giorni < 0 || f.giorni > 14) return;
    var fo = forseDi(f);
    if (fo.length) out.push({ f: f, film: fo });

}
function vociForseScaduti() {
  var out = [];

    if (f.stato !== 'Chiusa') return;
    var film = Object.keys(f.codici).filter(function (k) { var c = categoria(f.codici[k]) || ''; return c.indexOf('Forse') === 0 || c === 'Non iscritto'; });

// Scheda Nuovo festival già compilata dall'agente: i campi incerti sono evidenziati, si corregge e si salva
function controllaCompilato(x) {
  if (!x) return;
  var o = {};
  Object.keys(CHIAVE_DA_INTEST).forEach(function (h) { if (x[h] !== undefined && x[h] !== '') o[CHIAVE_DA_INTEST[h]] = x[h]; });
  var incerti = String(x['Campi incerti'] || '').split(/\s*[,;]\s*/).filter(Boolean);
  o.daVerificare = incerti.length ? 'Compilato in automatico (' + x.id + '): controllare ' + incerti.join(', ') : '';
  apriModulo('Controlla e aggiungi: ' + (x['Festival'] || x['Link']), MODULO_FESTIVAL, o, function (valori, sblocca) {
    if (!valori.nome) { toast('Il nome del festival è obbligatorio', true); sblocca(); return; }
    chiama('confermaDaCompilare', [x.id, valori], function (r) {
      chiudiModulo(); toast('Aggiunto ' + r.id + (x['Scadenze'] ? ' · le scadenze arrivano al prossimo giro dell\'agente' : ''));
      filtroFestival = { testo: '', stato: 'Tutti', soloForse: false, aperto: r.id, vista: 'elenco' };
      carica(true);
    }, sblocca);
  }, { nuovo: true });
  // Riquadro informativo in cima e campi incerti evidenziati
  var info = '<div class="info-compila">';
  if (x['Doppione di']) info += '<p class="avviso-compila"><b>Attenzione:</b> sembra già in lista come ' + esc(x['Doppione di']) + '.</p>';
  if (x.stato === 'Non compilabile') info += '<p class="avviso-compila">L\'agente non è riuscito a compilarlo: ' + esc(x['Note agente'] || '') + '</p>';
  else if (x['Note agente']) info += '<p><b>Note dell\'agente:</b> ' + esc(x['Note agente']) + '</p>';
  var extra = [['Categoria usata', x['Categoria usata']], ['Date evento', x['Date evento']]].filter(function (e) { return e[1]; });
  if (extra.length) info += '<p>' + extra.map(function (e) { return '<b>' + e[0] + ':</b> ' + esc(e[1]); }).join(' · ') + '</p>';
  if (x['Scadenze']) info += '<p><b>Tutte le scadenze trovate</b> (vanno nella scheda Scadenze dopo il salvataggio):</p><pre class="scadenze-compila">' + esc(x['Scadenze']) + '</pre>';
  if (incerti.length) info += '<p class="sub">I campi <span class="incerto-esempio">evidenziati</span> sono incerti: controllali prima di salvare.</p>';
  info += '</div>';
  var form = document.getElementById('modulo');
  form.insertAdjacentHTML('afterbegin', info);
  incerti.forEach(function (h) {
    var k = CHIAVE_DA_INTEST[h] || h; var campo = form.elements[k];
    if (campo && campo.closest) { var c = campo.closest('.campo'); if (c) c.classList.add('incerto'); }
  });
  document.getElementById('salva').textContent = 'Aggiungi alla lista';
}

  });

  });

  });
}

    h = '<h2>Imposta la password</h2><div class="sub-accesso">Scrivi la tua email: ti mandiamo un codice per scegliere la password.</div>' + msg +
      '<form id="f-recupero"><label>Email<input type="email" id="a-email" autocomplete="username" required value="' + esc(email) + '"></label>' +
      '<button class="entra" type="submit">Mandami il codice</button></form>' +
      '<button class="link-accesso" id="a-indietro">Torna all\'accesso</button>';
  } else if (passo === 'nuova') {
    h = '<h2>Scegli la password</h2><div class="sub-accesso">Account: <b>' + esc(email) + '</b></div>' + msg +
      '<form id="f-nuova" autocomplete="on"><input type="email" autocomplete="username" value="' + esc(email) + '" style="display:none">' +
      '<label>Codice ricevuto via email<input type="text" id="a-codice" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required></label>' +
      '<label>Nuova password (almeno 10 caratteri)<input type="password" id="a-password" autocomplete="new-password" minlength="10" required></label>' +
      '<label>Ripeti la password<input type="password" id="a-password2" autocomplete="new-password" minlength="10" required></label>' +
      '<label class="check-accesso"><input type="checkbox" id="a-mostra"> Mostra password</label>' +
      '<button class="entra" type="submit">Salva ed entra</button></form>' +
      '<button class="link-accesso" id="a-indietro">Chiedi un altro codice</button>';
  }
  box.innerHTML = h;
  var form = box.querySelector('form');
  var invia = form.querySelector('button[type=submit]');
  function attesa(si) { invia.disabled = si; invia.textContent = si ? 'Attendi…' : invia.getAttribute('data-testo'); }
  invia.setAttribute('data-testo', invia.textContent);
  function errore(m) { attesa(false); mostraAccessoMantieni(passo, dati, m); }
  var mostra = document.getElementById('a-mostra');
  if (mostra) mostra.onchange = function () {
    q('#scheda-accesso input[id^=a-password]').forEach(function (i) { i.type = mostra.checked ? 'text' : 'password'; });
  };
  var indietro = document.getElementById('a-indietro');
  if (indietro) indietro.onclick = function () { mostraAccesso(passo === 'nuova' ? 'recupero' : 'accesso', { email: email }); };
  var rec = document.getElementById('a-recupero');
  if (rec) rec.onclick = function () { mostraAccesso('recupero', { email: document.getElementById('a-email').value.trim() }); };
  form.onsubmit = function (ev) {
    ev.preventDefault();
    attesa(true);
    if (passo === 'accesso') {
      var em = document.getElementById('a-email').value.trim();
      chiamaAccesso('accedi', [em, document.getElementById('a-password').value, idDispositivo()], function (r) {
        if (r.serveCodice) mostraAccesso('codice', { email: em, maschera: r.email }); else entra(r);
      }, errore);
    } else if (passo === 'codice') {
      chiamaAccesso('confermaDispositivo', [dati.email, document.getElementById('a-codice').value.trim(), idDispositivo()], entra, errore);
    } else if (passo === 'recupero') {
      var em2 = document.getElementById('a-email').value.trim();
      chiamaAccesso('richiediCodicePassword', [em2], function (r) { mostraAccesso('nuova', { email: em2, ok: r.messaggio }); }, errore);
    } else if (passo === 'nuova') {
      var p1 = document.getElementById('a-password').value, p2 = document.getElementById('a-password2').value;
      if (p1 !== p2) return errore('Le due password non coincidono.');
      chiamaAccesso('impostaPassword', [email, document.getElementById('a-codice').value.trim(), p1, idDispositivo()], entra, errore);
    }
  };
  var primo = box.querySelector('input:not([style]):not([value]):not([type=checkbox])') || box.querySelector('input:not([style])');
  if (primo) setTimeout(function () { try { primo.focus(); } catch (e) {} }, 50);
}
// Mostra un errore senza perdere quello che è già stato scritto nei campi
function mostraAccessoMantieni(passo, dati, messaggio) {
  var valori = {};
  q('#scheda-accesso input[id]').forEach(function (i) { valori[i.id] = i.type === 'checkbox' ? i.checked : i.value; });
  var d = {}; Object.keys(dati).forEach(function (k) { if (k !== 'ok') d[k] = dati[k]; });
  d.errore = messaggio;
  if (valori['a-email']) d.email = valori['a-email'];
  mostraAccesso(passo, d);
  Object.keys(valori).forEach(function (id) {
    var i = document.getElementById(id); if (!i) return;
    if (i.type === 'checkbox') { i.checked = valori[id]; if (i.onchange) i.onchange(); } else if (id.indexOf('a-password') !== 0) i.value = valori[id];
  });
}
function avvio() {
  preparaApp(function () { // v2.22: prima recupera la memoria dell'app (se aperta dall'app)
    var token = memoria('orus_sessione');
    if (token) { SESSIONE.token = token; carica(false); }
    else { document.getElementById('contenuto').innerHTML = ''; mostraAccesso('accesso'); }
  });
}

  chiama('getDati', [], function (d) {
    D = d; M = elabora(d); C = null; compatInCorso = false; calStato.cache = {};
    document.getElementById('nome-utente').textContent = d.utente || '';
    var nn = M.proposti.filter(function (x) { return x.stato === 'Da valutare'; }).length;
    document.getElementById('badge-nuovi').textContent = nn ? nn : '';
    var nc = M.daCompilare.filter(function (x) { return x.stato === 'Compilato'; }).length;
    document.getElementById('badge-compila').textContent = nc ? nc : '';
    var ne = M.emailIscr.filter(function (x) { return STATI_EMAIL_APERTI.indexOf(x.stato) !== -1; }).length;
    document.getElementById('badge-email').textContent = ne ? ne : '';
    aggiornaCampanella(); // v2.15
    document.getElementById('aggiornato').textContent = 'Dati del ' + d.aggiornato;
    document.getElementById('ricarica').title = 'Dati del ' + d.aggiornato + ' · clic per aggiornare';
    if (mantieni) ridisegna(); else mostra();
  }, function (err) {
    if (!mantieni) document.getElementById('contenuto').innerHTML = '<div class="avviso">Errore nel caricamento: ' + esc(err && err.message ? err.message : err) + '</div>';
  });
}
document.querySelectorAll('#menu button').forEach(function (b) {

});
document.getElementById('ricarica').onclick = function () { carica(true); toast('Dati aggiornati'); };

document.getElementById('chiudi-modale').onclick = function () { chiudiModulo(); }; // v2.21
document.getElementById('esci').onclick = function () {
  var token = SESSIONE.token;
  chiudiSessione();
  if (token) google.script.run.esci(token);
  mostraAccesso('accesso', { ok: 'Sei uscito.' });
};
